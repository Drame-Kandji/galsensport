spring:
  application:
    name: galsensport-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/galsensport
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB


server:
  port: 8080


jwt:
  secret: galsensport-secret-key-development-2026
  expiration: 86400000

media:
  upload-dir: ./uploads
