spring:
  application:
    name: galsensport-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/galsensport}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000


server:
  port: 8080


jwt:
  secret: ${JWT_SECRET:galsensport-development-secret-key-change-me-2026}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

security:
  account-token-expiration: ${ACCOUNT_TOKEN_EXPIRATION:3600000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

media:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:galsensport}
    secret-key: ${MINIO_ROOT_PASSWORD:galsensport-dev-secret}
    bucket: ${MINIO_BUCKET:galsensport-media}
