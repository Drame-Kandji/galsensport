services:
  postgres:
    image: postgres:17
    container_name: galsensport-postgres
    restart: always
    environment:
      POSTGRES_DB: galsensport
      POSTGRES_USER: galsensport
      POSTGRES_PASSWORD: galsensport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
